name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/bili.mjs
          node --check selftest.mjs
          node --check test/plugin.test.mjs
      - name: Plugin-level test
        run: node test/plugin.test.mjs
      - name: Import smoke test
        run: |
          node -e "import('./index.js').then(m => { for (const k of ['name','inject','apply']) if (!(k in m)) throw new Error('missing export: ' + k); console.log('plugin exports ok'); })"
