# ============================================================================
# dsh-bili-manager —— DSH bundle patch（插件自带的挂载声明）
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add link:<本插件目录>
#   （发布到 npm 后：dsh plugin --profile desktop add dsh-bili-manager）
# ============================================================================

- insert:
    - id: bili-manager
      name: dsh-bili-manager
      config:
        # 写操作默认关闭；要用时在设置页或这里改 true
        enableWrite: false
        maxWritesPerSession: 10
